# Railway / Nixpacks build configuration (Next.js app service)
# The Python OCR service is deployed separately using ocr-service/Dockerfile.
# See SETUP.md for Railway deployment instructions.

[variables]
NODE_OPTIONS = "--max-old-space-size=2048"
NIXPACKS_NODE_VERSION = "20"

[phases.build]
cmds = ["NODE_OPTIONS='--max-old-space-size=4096' npm run build"]

[start]
# Sync schema changes then start app.
# OCR_SERVICE_URL must be set in Railway Variables to point to the OCR service.
# Example: http://ocr-service.railway.internal:8001
cmd = "npx prisma db push --accept-data-loss && npm start"
